[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csia-argentina-2026"
version = "0.1.0"
description = "Sentinel AI Guard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "SQLAlchemy>=2.0.30",
    "greenlet>=3.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "certifi>=2026.7.22",
    "cloudinary>=1.45.0",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
